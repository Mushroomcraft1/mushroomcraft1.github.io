<html theme="dark">
	<head>
		<style>
			:root {
				color-scheme: dark;
			}

			body, html {
				margin: none;
				padding: none;
				background-color: black;
				color: yellow;
				font: 1rem "Fira Sans", sans-serif;
			}
			canvas {
				position: fixed;
				width: 100%;
				height: 25%;
				bottom: 0;
			}
			
			.thin {
				width: 4rem;
			}

			.info {
				position: absolute;
			}

			#throttle {
				position: absolute;
				top: 50%;
				transform: rotate(-90deg);
			}

			.throttle {
				position: absolute;
				top: 50%;
			}

			.editor {
				position: absolute;
				top: 5rem;
			}

			.right {
				right: 0;
				margin-right: 0.5rem;
			}

			.centre {
				left: 30%;
				margin-right: 0.5rem;
			}

			.pulsing-element {
				margin-top: 1rem;
			}

			.pulsing {
				margin-top: 1rem;
				max-height: calc(75vh - 25rem);
				overflow-y: scroll;
			}

			button {
				margin-right: 0.5rem
			}

			#text {
				position: absolute;
				top: 5vw;
				left: 5vw;
				width: 90vw;
				height: calc(100vh - 10vw);
				overflow-y: scroll;
				background-color: #333a;
				border-radius: 1vw;
			}

			#reset {
				position: absolute;
				top: 0;
				left: 100px;
			}

			.buttons {
				position: absolute;
				display: flex;
				flex-direction: row;
				left: 0;
				bottom: calc(2.5vw - 1rem);
				width: 100%;
				height: 2rem;
				overflow: hidden;
				justify-content: center;
			}
		</style>
	</head>
	<body>
		<div class="info">
			<div>Frequency:  <span id="sine-frequency-val"></span> Hz</div>
			<div>Power:  <span id="power-val"></span> %</div>
			<div>Speed:  <span id="speed-val"></span> km/h</div>
		</div>
		<div class="info centre">
			<div>Audio: <select id="audio">
				<option value="24S">24kHz Single Phase</option>
				<option value="48S">48kHz Single Phase</option>
				<option value="96S">96kHz Single Phase</option>
				<option value="24T">24kHz 3 Phase</option>
				<option value="48T">48kHz 3 Phase</option>
				<option value="96T">96kHz 3 Phase</option>
			</select></div>
			<div><input type="range" min="0" max="1.5" step="0.05" id="volume"></input>Volume:  <span id="volume-val"></span> %</div>
		</div>
		<div class="info right">
			<div>Mode: <span id="method"></span></div>
			<div>Carrier Frequency:  <span id="carrier-frequency-val"></span> Hz</div>
			<div>Pulses:  <span id="pulses-val"></span></div>
		</div>
		<div class="throttle">
			<input id="throttle" type="range" min="-1" max="1" step="0.01"></input>
			<button id="reset">Reset Speed</button>
		</div>
		<div class="editor right">
			<button id="new">New Train</button><button id="save">JSON Editor</button><button id="generate-code">Generate Code</button><select id="load">

			</select>
			<br><br>
			<div id="train-config">
				
			</div>
		</div>
		<canvas id="canvas">
			
		</canvas>
		<textarea id="text" hidden="true"></textarea>
	</body>
	<script type="module" src="./pulsing.js"></script>
	<script type="module" src="./render.js"></script>
	<script type="module" src="./sound.js"></script>
	<script type="module" src="./interface.js"></script>
	<script type="module">
		import { setupDatabase, setTrain, setTrainSpeed, setSoundUpdateFunction, commandVF, getVFData, getTrainData, getAvailableTrains,
			pulsingModes, oscillationModes
		} from "./interface.js";
		import { setSoundOptions, startSound, stopSound } from "./sound.js";
		import { setCanvas, setRenderOptions, renderVisualisations } from "./render.js";

		let currentTrain = { controls: {} };
		let trainName = "";

		const canvas = document.getElementById("canvas");
		const ctx = canvas.getContext("2d");

		function clickFunction() { 
			setTimeout(() => {
				startSound()
					.then((funct) => {
						setSoundUpdateFunction(funct);
					});
				window.removeEventListener("pointerdown", clickFunction); 
			}, 100);
		}

		window.addEventListener("pointerdown", clickFunction);

		const throttleSlider = document.getElementById("throttle");
		const resetButton = document.getElementById("reset");

		resetButton.addEventListener("pointerdown", () => {
			frequency = 0;
			power = 0;
			throttle = 0;
		})

		function createElement(elementType, properties, classes) {
			const element = Object.assign(document.createElement(elementType), properties);
			if (classes != null) element.classList.add(...classes);
			return element;
		}

		function createInput(content, element) {
			const label = document.createElement("div");
			label.appendChild(document.createTextNode(content));
			label.appendChild(element);
			return label;
		}

		function loadTrainToSim() {
			currentTrain.speed_per_motor_hz = setTrain(structuredClone(currentTrain)).speed_per_motor_hz;
			const display = document.getElementById("speed-per-motor-hz")
			if (display != null) display.innerText = currentTrain.speed_per_motor_hz
		}

		function loadEditor(name, trainConfig) {
			frequency = 0;
			power = 0;
			throttle = 0;
			trainName = name;
			currentTrain = trainConfig;
			let pulsingIdx = 0;
			const indicies = [];

			const editor = document.getElementById("train-config");
			editor.replaceChildren();

			const nameValue = createElement("input", {
				type: "text", value: trainName
			});
			nameValue.addEventListener("change", () => {
				trainName = nameValue.value;
			});

			const wheelDiameter = createElement("input", {
				type: "number", value: currentTrain.wheel_diameter, step: 0.01, min: 0.1 
			}, ["thin"]);
			wheelDiameter.addEventListener("change", () => {
				currentTrain.wheel_diameter = Number(wheelDiameter.value);
				loadTrainToSim();
			});
			
			const gearRatio = createElement("span");
			const gearRatioMotorSide = createElement("input", {
				type: "number", value: currentTrain.gear_ratio_motor_side, step: 1, min: 0.1 
			}, ["thin"]);
			gearRatioMotorSide.addEventListener("change", () => {
				currentTrain.gear_ratio_motor_side = Number(gearRatioMotorSide.value);
				loadTrainToSim();
			});
			const gearRatioWheelSide = createElement("input", {
				type: "number", value: currentTrain.gear_ratio_wheel_side, step: 1, min: 0.1 
			}, ["thin"]);
			gearRatioWheelSide.addEventListener("change", () => {
				currentTrain.gear_ratio_wheel_side = Number(gearRatioWheelSide.value);
				loadTrainToSim();
			});
			gearRatio.append(gearRatioMotorSide, document.createTextNode(" : "), gearRatioWheelSide);

			const motorPoles = createElement("input", {
				type: "number", value: currentTrain.motor_poles, step: 2, min: 4, max: 8
			}, ["thin"]);
			motorPoles.addEventListener("change", () => {
				currentTrain.motor_poles = Number(motorPoles.value);
				loadTrainToSim();
			});
			
			// const speedPerMotorHz = createElement("input", {
			// 	type: "number", value: currentTrain.speed_per_motor_hz, step: 0.01, min: -1 
			// }, ["thin"]);
			// speedPerMotorHz.addEventListener("change", () => {
			// 	currentTrain.speed_per_motor_hz = speedPerMotorHz.value;
			// 	if (speedPerMotorHz.value < 0) delete currentTrain.speed_per_motor_hz;
			// 	loadTrainToSim();
			// });
			
			const maxSpeed = createElement("input", {
				type: "number", value: currentTrain.max_speed, step: 1, min: 0
			}, ["thin"]);
			maxSpeed.addEventListener("change", () => {
				currentTrain.max_speed = Number(maxSpeed.value);
				loadTrainToSim();
			});

			const peakPoint = createElement("input", {
				type: "number", value: currentTrain.peak_point, step: 1, min: 0
			}, ["thin"]);
			peakPoint.addEventListener("change", () => {
				currentTrain.peak_point = Number(peakPoint.value);
				loadTrainToSim();
			});

			const rollingResistance = createElement("input", {
				type: "number", value: currentTrain.rolling_resistance, step: 0.01, min: 0
			}, ["thin"]);
			rollingResistance.addEventListener("change", () => {
				currentTrain.rolling_resistance = Number(rollingResistance.value);
				loadTrainToSim();
			});

			if (currentTrain.controls == null) currentTrain.controls = {};

			const accelleration = createElement("input", {
				type: "number", value: currentTrain.controls.accelleration, step: 1, min: 0
			}, ["thin"]);
			accelleration.addEventListener("change", () => {
				currentTrain.controls.accelleration = Number(accelleration.value);
				loadTrainToSim();
			});

			const decelleration = createElement("input", {
				type: "number", value: currentTrain.controls.decelleration, step: 1, min: 0
			}, ["thin"]);
			decelleration.addEventListener("change", () => {
				currentTrain.controls.decelleration = Number(decelleration.value);
				loadTrainToSim();
			});

			const minPower = createElement("input", {
				type: "number", value: currentTrain.controls.min_power, step: 0.01, min: 0, max: 1
			}, ["thin"]);
			minPower.addEventListener("change", () => {
				currentTrain.controls.min_power = Number(minPower.value);
				loadTrainToSim();
			});

			const maxPower = createElement("input", {
				type: "number", value: currentTrain.controls.max_power, step: 0.01, min: 0, max: 2
			}, ["thin"]);
			maxPower.addEventListener("change", () => {
				currentTrain.controls.max_power = Number(maxPower.value);
				loadTrainToSim();
			});

			const speedPerMotorHzDisplay = createElement("div", {
				id: "speed-per-motor-hz"
			});

			function addPulsingMode(idx) {
				if (typeof idx != "number") idx = indicies.length;
				const ID = pulsingIdx++;
				if (idx < indicies.length) {
					indicies.splice(idx, 0, ID);
				} else {
					indicies.push(ID);
				}
				let pulsingMode = currentTrain.pulsing[idx] ?? { };
				if (pulsingMode.min_motor_frequency != null) pulsingMode.min_speed = pulsingMode.min_motor_frequency * currentTrain.speed_per_motor_hz;
				const newPulsingMode = createElement("div", {}, ["pulsing-element"]);
				const modes = createElement("select");
				for (const mode of pulsingModes) {
					modes.appendChild(createElement("option", {
						textContent: mode,
						value: mode
					}));
				}
				const oscillationMode = createElement("select", { "data-value": "oscillation_mode" });
				for (const mode of oscillationModes) {
					oscillationMode.appendChild(createElement("option", {
						textContent: mode,
						value: mode
					}));
				};
				function updateValue(event) {
					const element = event.srcElement;
					const key = element["data-value"];
					switch (key) {
						case "carrier_frequencies":
							pulsingMode[key] = element.value.split(/[, ]/).filter(e => e != "").map(Number);
							break;
						case "oscillation_mode":
							pulsingMode[key] = element.value;
							break;
						default:
							pulsingMode[key] = Number(element.value);
					}
					if (pulsingMode[key] < 0) delete pulsingMode[key];
					currentTrain.pulsing[idx] = pulsingMode;
					loadTrainToSim();
				}
				const variables = [
					createElement("input", { "data-value": "min_speed", type: "number", value: 0, step: 0.1, min: 0 }, ["thin"]),
					// createElement("input", { "data-value": "max_speed", type: "number", value: 0, step: 0.1, min: -1 }, ["thin"]),
					// createElement("input", { "data-value": "min_motor_frequency", type: "number", value: -1, step: 0.1, min: -1 }, ["thin"]),
					// createElement("input", { "data-value": "max_motor_frequency", type: "number", value: -1, step: 0.1, min: -1 }, ["thin"]),
					oscillationMode,
					createElement("input", { "data-value": "oscillation_frequency", type: "number", value: 5, step: 0.1, min: 0.1 }, ["thin"]),
					createElement("input", { "data-value": "carrier_frequency", type: "number", value: 400, step: 10, min: 50 }, ["thin"]),
					createElement("input", { "data-value": "carrier_frequencies", type: "string", value: "300, 350, 400, 450, 500", step: 10, min: 50 }),
					createElement("input", { "data-value": "min_carrier_frequency", type: "number", value: 400, step: 10, min: 50 }, ["thin"]),
					createElement("input", { "data-value": "max_carrier_frequency", type: "number", value: 500, step: 10, min: 50 }, ["thin"]),
					createElement("input", { "data-value": "pulses", type: "number", value: 21, step: 1, min: 1 }, ["thin"]),
					createElement("input", { "data-value": "min_pulses", type: "number", value: 1, step: 1, min: 1 }, ["thin"]),
					createElement("input", { "data-value": "max_pulses", type: "number", value: 21, step: 1, min: 1 }, ["thin"]),
					createElement("input", { "data-value": "pulse_step", type: "number", value: 2, step: 1, min: 1 }, ["thin"]),
					createElement("input", { "data-value": "max_switching_frequency", type: "number", value: 400, step: 10, min: 50 }, ["thin"]),
				];
				function updateVisibilities(visible) {
					let i = 0;
					for (const element of variables) {
						element.parentElement.hidden = !visible[i];
						if (visible[i]) {
							element.dispatchEvent(new Event("change"));
						}
						++i;
					}
				}
				modes.addEventListener("change", () => {
					pulsingMode.mode = modes.value;
					switch (modes.value) {
						case "ASYNC":
							{
								updateVisibilities([true, false, false, true, false, false, false, false, false, false, false, false]);
								break;
							}
						case "ASYNC-STEP":
							{
								updateVisibilities([true, false, false, false, true, false, false, false, false, false, false, false]);
								break;
							}
						case "ASYNC-OSCILLATING":
							{
								updateVisibilities([true, true, true, false, false, true, true, false, false, false, false, false]);
								break;
							}
						case "ASYNC-SWEEP":
							{
								updateVisibilities([true, false, false, false, false, true, true, false, false, false, false, false]);
								break;
							}
						case "AUTO-SYNC":
							{
								updateVisibilities([true, false, false, false, false, false, false, false, true, true, true, true]);
								break;
							}
						case "SYNC":
							{
								updateVisibilities([true, false, false, false, false, false, false, true, false, false, false, false]);
								break;
							}
						case "SHE-PWM":
							{
								updateVisibilities([true, false, false, false, false, false, false, true, false, false, false, false]);
								break;
							}
					}
					currentTrain.pulsing[idx] = pulsingMode;
					loadTrainToSim();
				});
				newPulsingMode.appendChild(
					createInput("Mode: ", modes),
				);
				const texts = [
					"Start Speed (km/h): ",
					// "Max Speed (km/h): ",
					// "Min Motor Frequency (Hz, -1 = N/A): ",
					// "Max Motor Frequency (Hz, -1 = N/A): ",
					"Oscillation Mode: ",
					"Oscilaltion Frequency (Hz): ",
					"Carrier Frequency (Hz): ",
					"Carrier Frequencies (Hz): ",
					"Min Carrier Frequency (Hz): ",
					"Max Carrier Frequency (Hz): ",
					"Pulses: ",
					"Min Pulses: ",
					"Max Pulses: ",
					"Pulse Step: ",
					"Max Switching Frequency: "
				];
				for (const element of variables) {
					const key = element["data-value"];
					if (pulsingMode[key] != null) element.value = pulsingMode[key];
					element.addEventListener("change", updateValue);
					newPulsingMode.appendChild(createInput(texts.shift(), element));
				}
				oscillationMode.addEventListener("change", updateValue)
				const deleteMode = createElement("button", {
					textContent: "Delete"
				});
				const insertMode = createElement("button", {
					textContent: "Insert Before"
				});
				deleteMode.addEventListener("click", () => {
					pulsing.removeChild(newPulsingMode);
					let idx = -1;
					for (let i = 0; i < indicies.length; ++i) if (indicies[i] == ID) idx = i;
					if (idx >= 0) {
						indicies.splice(idx, 1);
						currentTrain.pulsing.splice(idx, 1);
						loadTrainToSim();
					}
				});
				insertMode.addEventListener("click", () => {
					addPulsingMode(idx);
				});
				newPulsingMode.append(deleteMode, insertMode);
				pulsing.appendChild(newPulsingMode);
				if (idx < indicies.length) {
					pulsing.moveBefore(newPulsingMode, pulsing.children[idx]);
				}
				modes.value = pulsingMode.mode ?? "ASYNC";
				modes.dispatchEvent(new Event("change"));
				currentTrain.pulsing[idx] = pulsingMode;
			}

			const pulsing = createElement("div", {}, ["pulsing"]);
			const addPulsing = createElement("button", { textContent: "Add Pulsing" });
			addPulsing.addEventListener("click", addPulsingMode);

			for (let i = 0; i < currentTrain.pulsing.length; ++i) addPulsingMode(i);

			editor.replaceChildren(
				createInput("Name: ", nameValue),
				createInput("Wheel Diameter (m): ", wheelDiameter),
				createInput("Gear Ratio: ", gearRatio),
				createInput("Motor Poles: ", motorPoles),
				createInput("Speed Per Motor Hz: ", speedPerMotorHzDisplay),
				// createInput("Speed Per Motor Hz (-1 = N/A): ", speedPerMotorHz),
				createInput("Max Speed (km/h): ", maxSpeed),
				createInput("Peak Point: ", peakPoint),
				createInput("Rolling Resistance: ", rollingResistance),
				createInput("Acceleration (km/h): ", accelleration),
				createInput("Decelleration (km/h): ", decelleration),
				createInput("Min Power: ", minPower),
				createInput("Max Power: ", maxPower),
				createInput("Pulsing: ", addPulsing),
				pulsing
			);
			loadTrainToSim();
		}

		document.getElementById("new").addEventListener("click", () => {
			trainName = "New Train";
			loadEditor("New Train", {
				wheel_diameter: 0.84,
				gear_ratio_motor_side: 6,
				gear_ratio_wheel_side: 1,
				pulsing: [
					{
						mode: "ASYNC",
						carrier_frequency: 1500,
						min_speed: 0
					}
				]
			});
		});

		const displayArea = document.getElementById("text");

		function saveText(text) {
			displayArea.hidden = false;
			displayArea.textContent = text;
			const buttons = createElement("div", {}, ["buttons"]);
			const closeButton = createElement("button", { textContent: "Close" });
			const copyButton = createElement("button", { textContent: "Copy" });
			buttons.append(copyButton, closeButton);
			document.body.appendChild(buttons);
			closeButton.addEventListener("click", () => {
				displayArea.hidden = true;
				buttons.remove();
			});
			copyButton.addEventListener("click", () => {
				navigator.clipboard.writeText(displayArea.textContent);
			});
			return buttons;
		}

		document.getElementById("save").addEventListener("click", () => {
			console.log("Saving " + trainName);
			console.log(currentTrain);
			const trainSave = structuredClone(currentTrain);
			delete trainSave.speed_per_motor_hz;
			const buttons = saveText(JSON.stringify(
				trainSave,
				null, "\t"
			));

			const loadButton = createElement("button", { textContent: "Load" });	
			loadButton.addEventListener("click", () => {
				try {
					const json = JSON.parse(displayArea.value);
					loadEditor("JSON", json);
				} catch (err) {
					alert(err);
				}
			});
			buttons.appendChild(loadButton);
		});

		function generateCode() {
			let frequencies = ``;
			let ifStatements = ``;
			loadTrainToSim();
			const parsedTrain = getTrainData();
			let idx = 0;
			let frequenciesVariableIdx = 0;
			const poleRatio = Number(document.getElementById("export-motor-poles")?.value ?? 4)
				/ (currentTrain.motor_poles ?? 4)

			for (const pulsing of parsedTrain.pulsing) {
				if (++idx >= parsedTrain.pulsing.length) {
					ifStatements += `{\n`; 
				} else {
					ifStatements += `if (absSineFreq < (float)(${pulsing.max_motor_frequency * poleRatio})) {\n`;
				}

				switch (pulsing.mode) {
					case "ASYNC":
						{
							ifStatements += `\tswitchingMode = ASYNC;\n\tPWMfreq = (float)(${pulsing.carrier_frequency});\n`;
							break;
						}
					case "ASYNC-STEP":
						{
							const len = pulsing.carrier_frequencies.length;
							frequencies += `float frequencies${++frequenciesVariableIdx}[] = {${pulsing.carrier_frequencies.join(", ")}};\n\n`;
							ifStatements += `\tswitchingMode = ASYNC;\n\tPWMfreq = frequencies${frequenciesVariableIdx}[min(${len}, (int)((absSineFreq - ${pulsing.min_motor_frequency})`
							+ ` / ${pulsing.max_motor_frequency - pulsing.min_motor_frequency} * (float)(${len})))];\n`
							break;
						}
					case "ASYNC-SWEEP":
						{
							const scalar = (pulsing.max_carrier_frequency - pulsing.min_carrier_frequency)
							/ (pulsing.max_motor_frequency - pulsing.min_motor_frequency);
							ifStatements += `\tswitchingMode = ASYNC;\n\t`
							+ `PWMfreq = min(max(absSineFreq * ${scalar} + ${pulsing.min_carrier_frequency - scalar * pulsing.min_motor_frequency}, `
							+ `${pulsing.min_carrier_frequency}), ${pulsing.max_carrier_frequency});\n`;
							break;
						}
					case "ASYNC-OSCILLATING":
						{
							let oscillation = ``;

							switch (pulsing.oscillation_mode) {
								case "TRIANGLE":
									oscillation = `float factor = timeFactor >= 0.5f ? 2.0f - 2.0f * timeFactor : 2.0f * timeFactor;\n\t`
									+ `PWMfreq = (float)(${pulsing.max_carrier_frequency - pulsing.min_carrier_frequency} `
									+ `* factor + ${pulsing.min_carrier_frequency});`;
									break;
								case "SAW-RISING":
									oscillation = `PWMfreq = (float)(${pulsing.max_carrier_frequency - pulsing.min_carrier_frequency} `
									+ `* timeFactor + ${pulsing.min_carrier_frequency});`;
									break;
								case "SAW-FALLING":
									oscillation = `PWMfreq = (float)(${pulsing.max_carrier_frequency - pulsing.min_carrier_frequency} `
									+ `* (1.0f - timeFactor) + ${pulsing.min_carrier_frequency});`;
									break;
								case "SINE":
									oscillation = `float factor = sin(timeFactor * tau) / 2.0f + 0.5f;\n\t`
									+ `PWMfreq = (float)(${pulsing.max_carrier_frequency - pulsing.min_carrier_frequency} `
									+ `* factor + ${pulsing.min_carrier_frequency});`;
									break;
								case "SQUARE":
									oscillation = `PWMfreq = timeFactor <= 0.5f ? ${pulsing.min_carrier_frequency} : ${pulsing.max_carrier_frequency};`;
									break;
							}

							ifStatements += `\tswitchingMode = ASYNC;\n\t`
							+ `float timeFactor = fmod((float)(rawMicroSec % 1000000) / 1000000.0f, `
							+ `${1 / pulsing.oscillation_frequency}) * ${pulsing.oscillation_frequency};\n\t${oscillation}\n`
							break;
						}
					case "SYNC":
						{
							ifStatements += `\tswitchingMode = SYNC;\n\tnoOfSwitches = ${Math.floor(pulsing.pulses * 4)};\n`;
							break;
						}
					case "AUTO-SYNC":
						{
							let equation = `(int)(${pulsing.max_switching_frequency} / (absSineFreq * ${2 * pulsing.pulse_step}))`
							if ((pulsing.min_pulses & 1) && (pulsing.pulse_step & 1) == 0) equation = `(${equation} | 1)`; 
							ifStatements += `\tswitchingMode = SYNC;\n\tnoOfSwitches = min(${Math.floor(pulsing.max_pulses * 4)},`
							+ ` max(${Math.floor(pulsing.min_pulses * 4)}, ${equation} * 4.0f));\n`;
							break;
						}
				}

				if (idx < parsedTrain.pulsing.length) {
					ifStatements += `} else `;
				} else {
					ifStatements += `}\n`;
				}
			}
			let code = `${frequencies}sineFreq += throttle;\nfloat absSineFreq = abs(sineFreq);\npower = max(0.3f, min(1.0f, absSineFreq / 50.0f));\n\n`
			+ `${ifStatements}\n\nsineFreqTime = 1000000.0f / min(50, absSineFreq);\nsineFreqTimeInt = (unsigned long)sineFreqTime;\n`
			+ `PWMfreqTime = 1000000.0f / PWMfreq;\nPWMfreqTimeInt = (unsigned long)PWMfreqTime;`;
			return code;
		}

		document.getElementById("generate-code").addEventListener("click", () => {
			const buttons = saveText(generateCode());
			const noOfPoles = createElement("input", { id: "export-motor-poles", type: "number", min: 2, max: 8, step: 2, value: currentTrain.motor_poles ?? 4 }, ["thin"]);
			noOfPoles.addEventListener("change", () => { displayArea.textContent = generateCode() });
			buttons.appendChild( createInput("Number of poles: ", noOfPoles));
		});

		const frequencyElement = document.getElementById("sine-frequency-val");
		const carrierFrequencyElement = document.getElementById("carrier-frequency-val");
		const speedElement = document.getElementById("speed-val");
		const powerElement = document.getElementById("power-val");
		const pulsesElement = document.getElementById("pulses-val");

		const audioOptionsValue = document.getElementById("audio");
		const methodText = document.getElementById("method");

		const volumeSlider = document.getElementById("volume");
		const volumeVal = document.getElementById("volume-val")

		audioOptionsValue.value = "48T";

		audioOptionsValue.addEventListener("change", () => {
			stopSound();
			setSoundOptions({
				sampleRate: parseInt(audioOptionsValue.value.slice(0, 2)) * 1000,
				singlePhase: audioOptionsValue.value.endsWith("S")
			});
			startSound()
				.then((funct) => {
					setSoundUpdateFunction(funct);
				});
		})

		setCanvas(canvas, ctx);

		const loadTrain = document.getElementById("load");
		loadTrain.addEventListener("change", () => {
			loadEditor(loadTrain.value, setTrain(loadTrain.value));
		})

		setupDatabase("./trains.json")
			.then(() => {
				const trains = getAvailableTrains();
				loadTrain.replaceChildren();
				const compressed = {};
				for (const train of trains) {
					loadTrain.appendChild(createElement("option", {
						value: train,
						textContent: train
					}));
				}
				loadTrain.value = "kiepe tram (50 mph)";
				loadTrain.dispatchEvent(new Event("change"));
				loadTrainToSim();
				loop();
			});
		
		// Single phase visualisation that takes up most of the canvas
		setRenderOptions({
			renderSinglePhase: true,
			waveHeight: 0.4,
			phase1Position: 0.5,
			sampleRate: 20000,
			samplesPerPixel: 4
		});
		setSoundOptions({
			useInterpolation: true
		});

		let prevFrame = 0;

		let frequency = 0;
		let power = 0;
		let throttle = 0;
		let hill = 1;

		throttleSlider.addEventListener("change", (e) => {
			throttleSlider.value = 0;
		})

		function loop() {
			const time = performance.now();
			const deltaTime = time - prevFrame;
			prevFrame = time;

			throttle = Number(throttleSlider.value);
			const controls = currentTrain.controls ?? {};

			const peakPoint = currentTrain.peak_point == null ? 50 : currentTrain.peak_point * currentTrain.speed_per_motor_hz;
			const maxFrequency = currentTrain.max_speed == null ? 120 : currentTrain.max_speed * currentTrain.speed_per_motor_hz;
			const accelleration = (throttle > 0 ? (1 - Math.max(0, frequency - peakPoint) / Math.max(1, maxFrequency - peakPoint))
			 * ((controls.accelleration ?? 2.5) * hill): (controls.decelleration ?? 3) / hill) * throttle;

			frequency += deltaTime / 1000 * (accelleration * currentTrain.speed_per_motor_hz);

			frequency = Math.max(0, frequency);

			power = Math.abs(throttle)
			 * Math.max(controls.min_power ?? 0.1,
			   Math.min(1, frequency / peakPoint))
			 * (controls.max_power ?? 1);

			if (Math.abs(frequency) < 0.2) power = 0;

			commandVF(frequency, power, deltaTime);
			setSoundOptions({
				volume: Number(volumeSlider.value)
			});

			const {
				currentSpeed,
				currentFrequency,
				currentPower,
				carrierFrequency,
				pulses,
				pulsingMode,
			} = getVFData();

			// Update info text
			frequencyElement.textContent = currentFrequency.toFixed(2);
			speedElement.textContent = currentSpeed.toFixed(2);
			carrierFrequencyElement.textContent = Math.round(carrierFrequency);
			powerElement.textContent = Math.floor(currentPower * 100);
			pulsesElement.textContent = pulses;
			methodText.textContent = pulsingMode;
			volumeVal.textContent = Math.floor(volumeSlider.value * 100);

			renderVisualisations();

			requestAnimationFrame(loop);
		};

		// setInterval(loop, 100);
	</script>
