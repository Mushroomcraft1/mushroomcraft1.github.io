<html theme="dark">
	<head>
		<style>
			:root {
				color-scheme: dark;
			}

			body, html {
				margin: none;
				padding: none;
				background-color: black;
				color: yellow;
				font: 1rem "Fira Sans", sans-serif;
			}
			canvas {
				width: 100%;
				height: 100%;
			}

			.info {
				position: absolute;
			}

			.right {
				right: 0;
				margin-right: 0.5rem;
			}

			.centre {
				left: 30%;
				margin-right: 0.5rem;
			}
		</style>
	</head>
	<body>
		<div class="info">
			<div><input type="range" min="0.1" max="100" step="0.1" id="sine-frequency"></input>Frequency:  <span id="sine-frequency-val"></span> Hz</div>
			<div><input type="range" min="0" max="1" step="0.01" id="power"></input>Power:  <span id="power-val"></span> %</div>

		</div>
		<div class="info centre">
			<div>Audio: <select id="audio">
				<option value="24S">24kHz Single Phase</option>
				<option value="48S">48kHz Single Phase</option>
				<option value="96S">96kHz Single Phase</option>
				<option value="24T">24kHz 3 Phase</option>
				<option value="48T">48kHz 3 Phase</option>
				<option value="96T">96kHz 3 Phase</option>
			</select></div>
			<div><input type="range" min="1" max="25" step="0.1" id="sample-rate"></input>Visual Sample Rate:  <span id="sample-rate-val"></span>kHz</div>
			<div><input type="range" min="0.5" max="10" step="0.5" id="samples-per-pixel"></input>Samples Per Pixel:  <span id="samples-per-pixel-val"></span></div>
		</div>
		<div class="info right">
			<div>Mode: <select id="method">
				<option value="ASYNC">Async</option>
				<option value="SYNC">Sync</option>
				<option value="SHE-PWM">SHE-PWM</option>
			</select></div>
			<div><input type="range" min="50" max="1500" step="10" id="carrier-frequency"></input>Carrier Frequency:  <span id="carrier-frequency-val"></span> Hz</div>
			<div><input type="range" min="1" max="25" step="2" id="pulses"></input>Pulses:  <span id="pulses-val"></span></div>
		</div>
		<canvas id="canvas">
			
		</canvas>
	</body>
	<script src="./pulsing.js"></script>
	<script src="./render.js"></script>
	<script src="./sound.js"></script>
	<script>
		const canvas = document.getElementById("canvas");
		const ctx = canvas.getContext("2d");

		// Sliders
		const frequencyElement = document.getElementById("sine-frequency-val");
		const carrierFrequencyElement = document.getElementById("carrier-frequency-val");
		const powerElement = document.getElementById("power-val");
		const pulsesElement = document.getElementById("pulses-val");
		const sampleRateElement = document.getElementById("sample-rate-val");
		const samplesPerPixelElement = document.getElementById("samples-per-pixel-val");

		const frequencyValue = document.getElementById("sine-frequency");
		const carrierFrequencyValue = document.getElementById("carrier-frequency");
		const powerValue = document.getElementById("power");
		const pulsesValue = document.getElementById("pulses");
		const sampleRateValue = document.getElementById("sample-rate");
		const samplesPerPixelValue = document.getElementById("samples-per-pixel");
		const audioOptionsValue = document.getElementById("audio");
		const methodValue = document.getElementById("method");

		// Default values for sliders
		frequencyValue.value = 1;
		carrierFrequencyValue.value = 300;
		powerValue.value = 0.1;
		sampleRateValue.value = 10;
		samplesPerPixelValue.value = 2;
		pulsesValue.value = 21;
		methodValue.value = "ASYNC";
		audioOptionsValue.value = "48T";

		audioOptionsValue.addEventListener("change", () => {
			stopSound();
			setSoundOptions({
				sampleRate: parseInt(audioOptionsValue.value.slice(0, 2)) * 1000,
				singlePhase: audioOptionsValue.value.endsWith("S")
			});
			console.log(soundOptions);
			startSound();
		})

		setCanvas(canvas, ctx);
		startSound();
		
		// Single phase visualisation that takes up most of the canvas
		/*
		setRenderOptions({
			renderSinglePhase: true,
			waveHeight: 0.4,
			phase1Position: 0.5
		});
		*/

		function loop() {
			setFrequency(frequencyValue.value);
			setCarrierFrequency(carrierFrequencyValue.value);
			setPower(powerValue.value);
			setPulsingMethod(methodValue.value);
			setPulseCount(pulsesValue.value);

			setRenderOptions({
				sampleRate: sampleRateValue.value * 1000,
				samplesPerPixel: samplesPerPixelValue.value
			});

			// Update text next to the sliders
			frequencyElement.textContent = frequencyValue.value;
			carrierFrequencyElement.textContent = carrierFrequencyValue.value;
			powerElement.textContent = Math.floor(powerValue.value * 100);
			pulsesElement.textContent = pulsesValue.value;
			sampleRateElement.textContent = sampleRateValue.value;
			samplesPerPixelElement.textContent = samplesPerPixelValue.value;

			renderVisualisations();

			requestAnimationFrame(loop);
		};

		loop();
	</script>
</html>
