<html theme="dark">
	<head>
		<style>
			:root {
				color-scheme: dark;
			}

			body, html {
				margin: none;
				padding: none;
				background-color: black;
				color: yellow;
				font: 1rem "Fira Sans", sans-serif;
			}
			canvas {
				width: 100%;
				height: 100%;
			}

			.info {
				position: absolute;
			}

			.right {
				right: 0;
				margin-right: 0.5rem;
			}
		</style>
	</head>
	<body>
		<div class="info">
			<div><input type="range" min="1" max="100" step="1" id="sine-frequency"></input>Frequency:  <span id="sine-frequency-val"></span> Hz</div>
			<div><input type="range" min="0" max="1" step="0.05" id="power"></input>Power:  <span id="power-val"></span> %</div>
			<div><input type="range" min="0.01" max="1" step="0.01" id="time-warp"></input>Time Warp:  <span id="time-warp-val"></span>x</div>
			<div><input type="range" min="0" max="1" step="0.1" id="movement"></input>Movement:  <span id="movement-val"></span> %</div>

		</div>
		<div class="info right">
			<div>Mode: <select id="method">
				<option value="ASYNC">Async</option>
				<option value="SYNC">Sync</option>
				<option value="SHE-PWM">SHE-PWM</option>
			</select></div>
			<div><input type="range" min="50" max="1000" step="50" id="carrier-frequency"></input>Carrier Frequency:  <span id="carrier-frequency-val"></span> Hz</div>
			<div><input type="range" min="1" max="25" step="2" id="pulses"></input>Pulses:  <span id="pulses-val"></span></div>
		</div>
		<canvas id="canvas">
			
		</canvas>
	</body>
	<script src="./pulsing.js"></script>
	<script src="./render.js"></script>
	<script src="./sound.js"></script>
	<script>
		const canvas = document.getElementById("canvas");
		const ctx = canvas.getContext("2d");

		// Sliders
		const frequencyElement = document.getElementById("sine-frequency-val");
		const carrierFrequencyElement = document.getElementById("carrier-frequency-val");
		const powerElement = document.getElementById("power-val");
		const pulsesElement = document.getElementById("pulses-val");
		const timeWarpElement = document.getElementById("time-warp-val");
		const movementElement = document.getElementById("movement-val");

		const frequencyValue = document.getElementById("sine-frequency");
		const carrierFrequencyValue = document.getElementById("carrier-frequency");
		const powerValue = document.getElementById("power");
		const pulsesValue = document.getElementById("pulses");
		const timeWarpValue = document.getElementById("time-warp");
		const movementValue = document.getElementById("movement");
		const methodValue = document.getElementById("method");

		// Default values for sliders
		frequencyValue.value = 1;
		carrierFrequencyValue.value = 300;
		powerValue.value = 0.1;
		timeWarpValue.value = 0.1;
		movementValue.value = 0;
		pulsesValue.value = 21;
		methodValue.value = "ASYNC";

		setCanvas(canvas, ctx);
		startSound();
		
		// Single phase visualisation that takes up most of the canvas
		/*
		setRenderOptions({
			renderSinglePhase: true,
			waveHeight: 0.4,
			phase1Position: 0.5
		});
		*/

		function loop() {
			setFrequency(frequencyValue.value);
			setCarrierFrequency(carrierFrequencyValue.value);
			setPower(powerValue.value);
			setPulsingMethod(methodValue.value);
			setPulseCount(pulsesValue.value);

			setRenderOptions({
				timeScale: timeWarpValue.value * 1000,
				movement: movementValue.value
			});

			// Update text next to the sliders
			frequencyElement.textContent = frequencyValue.value;
			carrierFrequencyElement.textContent = carrierFrequencyValue.value;
			powerElement.textContent = Math.floor(powerValue.value * 100);
			pulsesElement.textContent = pulsesValue.value;
			timeWarpElement.textContent = timeWarpValue.value;
			movementElement.textContent = Math.floor(movementValue.value * 100);

			renderVisualisations();

			requestAnimationFrame(loop);
		};

		loop();
	</script>
</html>
