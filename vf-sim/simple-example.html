<html theme="dark">
	<head>
		<style>
			:root {
				color-scheme: dark;
			}

			body, html {
				margin: none;
				padding: none;
				background-color: black;
				color: yellow;
				font: 1rem "Fira Sans", sans-serif;
			}

			canvas {
				position: fixed;
				width: 100%;
				height: 25%;
				bottom: 0;
				left: 0;
			}

			#throttle {
				position: absolute;
				top: 50%;
				transform: rotate(-90deg);
			}

			.speed {
				position: absolute;
				width: 100%;
				top: 20vh;
				font-size: calc(min(20vw, 200px));
				text-align: center;
			}

			.unit {
				font-size: 0.2em;
				margin-left: 20px;
			}
		</style>
	</head>
	<body>
		<input id="throttle" type="range" min="-1" max="1" step="0.01"></input>
		<div class="speed"><span id="speed">--</span><span class="unit">km/h</span></div>
		<canvas id="canvas">
			
		</canvas>
	</body>
	<script type="module" src="https://mushroomcraft1.github.io/vf-sim/pulsing.js"></script>
	<script type="module" src="https://mushroomcraft1.github.io/vf-sim/render.js"></script>
	<script type="module" src="https://mushroomcraft1.github.io/vf-sim/sound.js"></script>
	<script type="module" src="https://mushroomcraft1.github.io/vf-sim/interface.js"></script>
	<script type="module">
		import { setupDatabase, setTrain, setTrainSpeed, setSoundUpdateFunction, getTrainData, getAvailableTrains } from "./interface.js";
		import { setSoundOptions, startSound, stopSound } from "./sound.js";
		import { setCanvas, setRenderOptions, renderVisualisations } from "./render.js";

		let currentTrain;

		const throttleSlider = document.getElementById("throttle");
		const speedDisplay = document.getElementById("speed");

		const canvas = document.getElementById("canvas");
		const ctx = canvas.getContext("2d");

		function clickFunction() { 
			setTimeout(() => {
				startSound()
					.then((funct) => {
						setSoundUpdateFunction(funct);
					});
				window.removeEventListener("pointerdown", clickFunction); 
			}, 100);
		}

		// Start the sound once the mouse was pressed
		window.addEventListener("pointerdown", clickFunction);

		setCanvas(canvas, ctx);

		setupDatabase("https://mushroomcraft1.github.io/vf-sim/trains.json")
			.then(() => {
				reset();
				loop();
			});
		
		// Single phase visualisation that takes up most of the canvas
		setRenderOptions({
			renderSinglePhase: true,
			waveHeight: 0.4,
			phase1Position: 0.5,
			sampleRate: 10000,
			samplesPerPixel: 1
		});
		setSoundOptions({
			useInterpolation: true // Smoothly transitions the commanded frequency, useful for
		});						   // low update rates, and makes async-sweep sound better 

		let prevFrame = 0;
		let speed = 0;

		function reset() {
			const trains = getAvailableTrains();
			currentTrain = setTrain("taurus");
			
			speed = 0;
		}

		function loop() {
			const time = performance.now();
			const deltaTime = time - prevFrame;
			prevFrame = time;

			const controls = currentTrain.controls ?? {};
			const throttle = Number(throttleSlider.value);

			// Simple calculations to simulate acceleration falloff
			const peakPoint = currentTrain.peak_point ?? 100;
			const maxSpeed = currentTrain.max_speed ?? 160;
			const accelleration = (throttle > 0 ? 
			 (1 - Math.max(0, speed - peakPoint) / Math.max(1, maxSpeed - peakPoint))
			 * (controls.accelleration ?? 2.5) 
			 : controls.decelleration ?? 3) * throttle;

			// Delta time is used so the acceleration doesn't vary with framerate
			speed += deltaTime / 1000 * accelleration;
			speed = Math.max(0, speed);

			setTrainSpeed(speed);
			setSoundOptions({
				volume: 0.75
			});

			speedDisplay.innerText = Math.round(speed);

			renderVisualisations();

			requestAnimationFrame(loop);
		};
	</script>
</html>
